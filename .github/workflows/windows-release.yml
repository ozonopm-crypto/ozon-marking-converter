name: Release Windows / Выпустить Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version / Версия, например 1.2.3'
        required: true
        type: string
      notes_ru:
        description: 'Описание на русском / Russian release notes'
        required: true
        type: string
      notes_en:
        description: 'Описание на английском / English release notes'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build and test / Собрать и проверить
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES_RU: ${{ inputs.notes_ru }}
          RELEASE_NOTES_EN: ${{ inputs.notes_en }}
        run: |
          $ErrorActionPreference = 'Stop'
          $current = [regex]::Match([IO.File]::ReadAllText('src/windows/App.cs'), 'AssemblyVersion\("(\d+\.\d+\.\d+)\.0"\)').Groups[1].Value
          if ([version]$env:RELEASE_VERSION -le [version]$current) { throw 'Use a newer version / Укажите версию выше текущей.' }
          $notes = "RU: " + $env:RELEASE_NOTES_RU + [Environment]::NewLine + "EN: " + $env:RELEASE_NOTES_EN
          & ./src/windows/prepare-release.ps1 -Version $env:RELEASE_VERSION -Notes $notes
      - name: Publish update / Опубликовать обновление
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath "outputs/publish/downloads/OzonMarkingConverter-Setup-$env:RELEASE_VERSION.exe" -Destination downloads -Force
          Copy-Item -LiteralPath outputs/publish/windows-updates.json -Destination windows-updates.json -Force
          git config user.name 'PEI Release'
          git config user.email '328776067+ozonopm-crypto@users.noreply.github.com'
          git add -- "downloads/OzonMarkingConverter-Setup-$env:RELEASE_VERSION.exe" windows-updates.json src/windows/App.cs src/windows/installer.iss
          git commit -m "Windows release $env:RELEASE_VERSION / Выпуск Windows $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed / Не удалось создать выпуск.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Push rejected; inspect main / Публикация отклонена. Проверьте main.' }
